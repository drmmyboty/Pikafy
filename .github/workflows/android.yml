name: Build Pikafy APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        run: flutter create . --platforms=android --project-name=pikafy
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" --dart-define=YOUTUBE_API_KEY="${{ secrets.YOUTUBE_API_KEY }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
